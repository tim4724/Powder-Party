<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="app-version" content="__APP_VERSION__" />
  <title>Powder Party</title>
  <link rel="icon" href="data:," />
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/fredoka-variable.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/nunito-variable.woff2" crossorigin />
  <!-- Three.js (vendored). The inline importmap is the one script needing a CSP
       nonce; the module entry is external so it's covered by 'self'. -->
  <script type="importmap" nonce="__CSP_NONCE__">
  {
    "imports": {
      "three": "/vendor/three/three.module.js",
      "three/addons/": "/vendor/three/addons/"
    }
  }
  </script>
  <link rel="modulepreload" href="/vendor/three/three.core.js" />
  <link rel="modulepreload" href="/vendor/three/three.module.js" />
  <link rel="stylesheet" href="/shared/theme.css?v=__APP_V__" />
  <link rel="stylesheet" href="/display/display.css?v=__APP_V__" />

  <!-- Transport + shared contract: classic scripts set window globals BEFORE
       the deferred module entry runs. -->
  <script src="/shared/protocol.js?v=__APP_V__"></script>
  <script src="/partyplug/PartyConnection.js?v=__APP_V__"></script>
  <script src="/partyplug/RoomFlow.js?v=__APP_V__"></script>
  <script src="/partyplug/PartyFastlane.js?v=__APP_V__"></script>
</head>
<body>
  <!-- Persistent 3D backdrop. In the lobby it slowly orbits the slope (live
       preview); in a run it draws the split-screen world. -->
  <div id="scene"></div>

  <!-- Lobby — the join/roster card on the left, QR on the right. -->
  <section id="lobby">
    <div class="lobby__card card">
      <h1>Powder <span>Party</span></h1>
      <div class="join">
        <div class="join__label">Join at</div>
        <div class="join__url" id="joinurl">…</div>
      </div>
      <div id="count">Scan the QR code to join</div>
      <div id="players">
        <div class="seat seat--open"><span class="seat__open">Open</span></div>
        <div class="seat seat--open"><span class="seat__open">Open</span></div>
        <div class="seat seat--open"><span class="seat__open">Open</span></div>
        <div class="seat seat--open"><span class="seat__open">Open</span></div>
      </div>
      <!-- Difficulty — the SAME Blue/Red/Black switch as the host's phone (shared
           widget). The orbiting backdrop re-rolls to match, so the tier reads at a
           glance. Live on the big screen too (the display is authoritative); on a
           pointer-less TV it simply mirrors the host's pick. -->
      <div id="level-select" class="level-select lobby__level" role="group" aria-label="Run difficulty" aria-live="polite">
        <span class="level-select__cap">Difficulty</span>
        <div id="level-seg" class="level-seg"></div>
      </div>
    </div>
    <div class="lobby__qr">
      <div class="qr-card"><canvas id="qr"></canvas></div>
    </div>
  </section>

  <!-- Run overlays over the persistent #scene backdrop -->
  <section id="race" class="hidden">
    <button id="pause-btn" class="icon-btn" aria-label="Pause"><span class="pause-glyph"></span></button>
    <div id="countdown"></div>
    <div id="pause-overlay" class="hidden">
      <div class="pause-card card">
        <h2>Paused</h2>
        <div class="pause-card__btns">
          <button id="pause-continue" class="btn btn--brand">Continue</button>
          <button id="pause-newgame" class="btn btn--ghost">New run</button>
        </div>
      </div>
    </div>
    <div id="results" class="hidden">
      <div class="results-card card">
        <h2>Results</h2>
        <ol id="results-list"></ol>
        <div class="results-card__btns">
          <button id="results-again" class="btn btn--brand">Play again</button>
          <button id="results-newgame" class="btn btn--ghost">New game</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Device choice — this is the BIG-SCREEN page, so a phone landing here (a
       shared link, or a controller that bailed out of a dead room with
       /?bail=game_ended) gets a chooser instead of the heavy display: the
       pitch, a "get it on a large screen" share/copy CTA, and a quiet
       "continue on this device" fallback. Visibility is pure CSS: a cramped
       viewport shows it unless html carries .device-choice-dismissed (the
       continue button) or .in-session (a run is on — resizing mid-race must
       not cover the world). The ?bail reason lands as a toast. -->
  <div id="device-choice" role="dialog" aria-modal="true" aria-labelledby="dc-title">
    <div class="dc-card card">
      <h1 id="dc-title">Powder <span>Party</span></h1>
      <p class="dc-sub">A downhill ski race for the living room — the big screen runs the mountain, phones are the controllers.</p>
      <p id="dc-toast" class="dc-toast hidden" role="status" aria-live="polite"></p>
      <button id="dc-share" type="button" class="btn btn--brand">Open on a large screen</button>
      <button id="dc-continue" type="button" class="btn btn--ghost">Continue on this device</button>
    </div>
  </div>

  <!-- Build stamp — populated by the server only on a preview deployment; :empty (hidden) otherwise. -->
  <div class="build-badge" role="status" aria-label="build version">__VERSION_BADGE__</div>

  <script type="module" src="/display/main.js?v=__APP_V__"></script>
</body>
</html>
